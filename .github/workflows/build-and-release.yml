name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-test:
    name: Backend Tests (Cloudflare Worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Vitest Tests
        working-directory: backend
        run: npm test

  android-build:
    name: Android Build & Test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            mkdir -p android/app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/openmapper.keystore
          else
            echo "No signing keystore secret provided. Skipping decode."
          fi

      - name: Build Android APK
        id: build_apk
        run: |
          cd android
          if [ -f "app/keystore/openmapper.keystore" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$APP_SECRET" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          else
            echo "Building Debug APK (missing keystore or signing secrets)..."
            ./gradlew assembleDebug
            echo "BUILD_TYPE=debug" >> $GITHUB_ENV
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          fi

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          cp android/${{ env.APK_PATH }} dist/OpenMapper-latest.apk
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            cp dist/OpenMapper-latest.apk dist/OpenMapper-${TAG_NAME}.apk
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMapper-APK
          path: dist/*.apk
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [backend-test, android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenMapper-APK
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "OpenMapper Release ${{ github.ref_name }}"
